# Account identifiers and credentials remain in Noctalia's mutable state and
# must not be stored in the Nix store.
config_version = 13

[audio]
enable_sounds = true
sound_volume = 0.99999997764825821

[bar]
order = ["default"]

[bar.default]
capsule = true
end = [
  "privacy",
  "media",
  "bar_2",
  "status",
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "control-center",
  "session",
]
font_family = "Maple Mono NF CN"
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = ["workspaces", "active_window", "launcher", "wallpaper", "bar", "status_2"]

[calendar]
enabled = true

[control_center]
hidden_tabs = ["power"]
sidebar = "full"
sidebar_section = "full"
width = 900

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "mic_mute"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "keyboard_layout"

[dock]
background_opacity = 0.99999997764825821
enabled = true
pinned = ["org.kde.dolphin", "zen-beta", "vesktop", "spotify", "com.mitchellh.ghostty"]
reserve_space = false
show_dots = true
smart_auto_hide = true

[hot_corners]
enabled = true

[idle]
pre_action_fade_seconds = 10

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.0
tint_intensity = 0.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-login-box@DP-1",
  "lockscreen-login-box@HDMI-A-1",
  "lockscreen-widget-0000000000000001",
  "lockscreen-widget-0000000000000002",
  "lockscreen-widget-0000000000000003",
  "lockscreen-widget-0000000000000004",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
box_height = 196.0
box_width = 720.0
cx = 1280.0
cy = 1321.0
output = "DP-1"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_variant"
background_opacity = 0.80000000000000004
background_radius = 32.0
center_password_text = false
input_opacity = 0.80000000000000004
input_radius = 32.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = false
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 196.0
box_width = 720.0
cx = 960.0
cy = 961.0
output = "HDMI-A-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
background_color = "surface_variant"
background_opacity = 0.80000000000000004
background_radius = 32.0
center_password_text = false
input_opacity = 0.80000000000000004
input_radius = 32.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = false
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
box_height = 80.0
box_width = 160.0
cx = 1280.0
cy = 248.0
output = "DP-1"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
background = false
background_radius = 32
center_text = true
format = "{:%H:%M}"
timezone = "Europe/Berlin"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
box_height = 128.0
box_width = 320.0
cx = 1280.0
cy = 1152.0
output = "DP-1"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "media_player"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
background = false
background_padding = 8
background_radius = 32
font_family = ""
hide_when_no_media = true
layout = "horizontal"
shadow = false

[lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
box_height = 64.0
box_width = 192.0
cx = 1280.0
cy = 80.0
output = "DP-1"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "weather"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
background = false
forecast_days = 2
shadow = true
show_forecast = false

[lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
box_height = 48.0
box_width = 272.0
cx = 1280.0
cy = 320.0
output = "DP-1"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
background = false
center_text = true
clock_style = "digital"
format = "{:%A, %Y-%m-%d}"
timezone = "Europe/Berlin"

[notification]
filter_order = ["filter"]

[notification.filter.filter]
allow_permanent = true
enabled = true
match = "yubikey touch detector"
match_content = "YubiKey is waiting for touch"
override_duration = 5000
play_sound = true
save_history = false
show_toast = true

[osd]
position_vertical = "center_right"

[plugin_settings."pozzoo/hassio"]
entity_manager_open_near_click = true
entity_manager_placement = "attached"

[plugins]
enabled = ["salemsayed/codexbar-meter", "pozzoo/hassio", "icefish/phone-connect", "gabedunn/voxtype"]

[shell]
avatar_path = "@HOME@/Pictures/profile_picture.JPG"
clipboard_enabled = false
corner_radius_scale = 2.0
date_format = "%Y-%m-%d"
font_family = "Noto Sans"
launch_apps_as_systemd_services = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

[shell.launcher]
compact = true

[shell.panel]
transparency_mode = "soft"

[shell.screen_corners]
enabled = true

[shell.session]
grid_columns = 5

[[shell.session.actions]]
action = "command"
command = "reboot-windows"
countdown_seconds = 10.0
enabled = true
glyph = "brand-windows-filled"
label = "Windows"
shortcut = "0"
variant = "outline"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Lavender"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/etc/wallpaper"
transition_on_startup = true

[wallpaper.default]
path = "/etc/wallpaper/wallpaper.jpg"

[wallpaper.last]
path = "/etc/wallpaper/wallpaper.jpg"

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.bar_2]
type = "salemsayed/codexbar-meter:bar"

[widget.bluetooth]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%Y-%m-%d %H:%M}"

[widget.control-center]
glyph = "settings"

[widget.launcher]
enabled = false

[widget.media]
hide_when_no_media = true
max_length = 400
title_scroll = "on_hover"

[widget.network]
enabled = false

[widget.privacy]
hide_inactive = true

[widget.status]
type = "pozzoo/hassio:status"

[widget.status_2]
type = "gabedunn/voxtype:status"

[widget.wallpaper]
enabled = false
