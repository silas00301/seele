# Keep failed commands inspectable; successful exits still close the pane.
set-option -g remain-on-exit failed
set-option -g remain-on-exit-format '#{?pane_dead_signal,Signal #{pane_dead_signal},Exit #{pane_dead_status}} · C-s Shift+R: restart · C-s q: close'
# The native command also refuses a live pane if its state races this guard.
bind-key -N 'Restart an exited pane' R if-shell -F '#{pane_dead}' 'respawn-pane' 'display-message "Pane is still running"'
