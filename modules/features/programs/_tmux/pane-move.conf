# Native prefix+m marks a pane; prefix+M clears it.
bind-key -N 'Move marked pane below this pane' j if-shell -F '#{pane_marked_set}' {
  join-pane -v -s '{marked}'
} {
  display-message 'Mark a pane with prefix+m, then choose its destination and press prefix+j or prefix+J'
}
bind-key -N 'Move marked pane beside this pane' J if-shell -F '#{pane_marked_set}' {
  join-pane -h -s '{marked}'
} {
  display-message 'Mark a pane with prefix+m, then choose its destination and press prefix+j or prefix+J'
}
