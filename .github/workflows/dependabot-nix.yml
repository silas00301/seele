# Unprivileged build signal for Dependabot lockfile pull requests.
# Nix from the pull request runs here only. This file has no secrets context,
# no Copilot invocation, and no contents: write permission.

name: Dependabot Nix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - flake.nix
      - flake.lock

permissions:
  contents: read

concurrency:
  group: dependabot-nix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Restore the Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-gha-cache: "enabled"
          use-flakehub: "false"
          diagnostic-endpoint: ""

      - name: Build the updated configuration
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          COPILOT_GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_TOKEN}${GH_TOKEN}${COPILOT_GITHUB_TOKEN}" ]; then
            echo 'Refusing to evaluate Nix while a GitHub token is set.' >&2
            exit 1
          fi
          nix eval --raw .#nixosConfigurations.nerv.config.system.build.toplevel.drvPath \
            --no-write-lock-file \
            --option accept-flake-config false \
            --option sandbox true
          nix build .#nixosConfigurations.nerv.config.system.build.toplevel \
            --no-link \
            --no-write-lock-file \
            --option accept-flake-config false \
            --option sandbox true
